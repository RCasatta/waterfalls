name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build
    - name: Download bitcoind 28.0
      run: curl -sSL https://bitcoincore.org/bin/bitcoin-core-28.0/bitcoin-28.0-x86_64-linux-gnu.tar.gz | tar -xz
    - name: Download elementsd 23.2.4
      run: curl -sSL https://github.com/ElementsProject/elements/releases/download/elements-23.2.4/elements-23.2.4-x86_64-linux-gnu.tar.gz | tar -xz
    - name: Run tests
      run: cargo test --features test_env
    - name: Run ignored tests
      run: cargo test --features test_env -- --ignored
    - name: Run reorg crash test
      run: cargo test --features "test_env,db,reorg_crash_test" test_bitcoin_reorg_data_not_persisted -- --exact
    env:
      BITCOIND_EXEC: ${{ github.workspace }}/bitcoin-28.0/bin/bitcoind
      ELEMENTSD_EXEC: ${{ github.workspace }}/elements-23.2.4/bin/elementsd

  checks:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
    - uses: actions/checkout@v4
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
    - name: Check
      run: cargo check
    - name: Check benches
      run: cargo check --benches
    - name: Check tests
      run: cargo check --tests --features test_env
    - name: Check no default features
      run: cargo check --no-default-features
    - name: Check no default features with test_env
      run: cargo check --no-default-features --features test_env
    - name: Reject TLS crates in normal and build dependencies
      # The binary talks plain HTTP to the node. Dev-dependencies (lwk, for the
      # internet tests) still pull rustls, so only normal/build edges are checked.
      # `cargo tree -i` errors out when the crate is not in Cargo.lock at all:
      # that means "not present"; any other error fails the step.
      run: |
        status=0
        for crate in rustls openssl openssl-sys native-tls; do
          if tree=$(cargo tree --locked -e normal,build --all-features --target all -i "$crate" 2>/tmp/cargo-tree.err); then
            if [ -n "$tree" ]; then
              echo "::error::$crate is in the normal/build dependency tree"
              echo "$tree"
              status=1
            fi
          elif grep -q "did not match any packages" /tmp/cargo-tree.err; then
            :
          else
            cat /tmp/cargo-tree.err
            status=1
          fi
        done
        exit $status

  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit
    - name: Reject high-severity vulnerabilities
      run: cargo audit

  nix:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
      with:
        extra_nix_config: |
          trusted-public-keys = nix.casatta.it:HseKZh7436/vKXfZDBHbhr7wwAkzjLwY5BIq+OOrITg= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
          substituters = https://nix.casatta.it https://cache.nixos.org/
    - run: nix build .
